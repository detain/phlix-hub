[php]
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300

[opcache]
; R14-13: `opcache.enable` alone does NOTHING for a CLI process — opcache is
; compiled into the image but stays off unless `opcache.enable_cli` is set too.
; This daemon IS the CLI SAPI (`php start.php start`, resident for weeks), so
; the whole block below was inert until this line existed. Enabling it is the
; point of shipping these values at all: a resident server recompiling every
; worker's full class graph on each boot is the one workload opcache exists
; for. Same defect class phlix-server documented in its own docker/php.ini.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1

[date]
date.timezone = UTC

[xdebug]
; Default mode is OFF - use XDEBUG_MODE env var to enable
; Options: off, develop, trace, debug (can combine with comma: "develop,trace")
xdebug.mode = ${XDEBUG_MODE:-off}
xdebug.start_with_request = trigger
xdebug.trigger_value = "${XDEBUG_TRIGGER:-devdebug}"
xdebug.trace_output_dir = /tmp/xdebug
xdebug.max_nesting_level = 512
xdebug.collect_assignments = 1
xdebug.collect_return_value = 1
