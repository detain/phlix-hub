[php]
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300

[opcache]
; R14-13: `opcache.enable` alone does NOTHING for a CLI process — opcache is
; compiled into the image but stays off unless `opcache.enable_cli` is set too.
; This daemon IS the CLI SAPI (`php start.php start`, resident for weeks), so
; the whole block below was inert until this line existed. Enabling it is the
; point of shipping these values at all: a resident server recompiling every
; worker's full class graph on each boot is the one workload opcache exists
; for. Same defect class phlix-server documented in its own docker/php.ini.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
; validate_timestamps=0: new code is picked up only because
; WorkermanProcessReloader calls opcache_reset() before the graceful SIGUSR2 reload (HUB-67).
opcache.validate_timestamps = 0
opcache.save_comments = 1

[date]
date.timezone = UTC

[xdebug]
; DISCLOSURE (review hub__devops Info / HUB-20, 2026-11-04): the container
; base image never installs the xdebug extension - ghcr.io/detain/phlix-base
; (built from the Dockerfile.base in the phlix-server repo) carries no xdebug
; in its docker-php-ext-install list and no pecl step for it (symbol cite:
; the list moves with base rebuilds). PHP silently ignores directives for
; modules that are not loaded, so this whole section is INERT in the
; container by default - dead config kept only as the on-switch if a
; debug-capable base ever ships, NOT a promise that container debugging
; works today. Bare-metal provisioning NO LONGER arms Xdebug at all: after
; the swoole coroutine-teardown GPF evidence (2026-11-05, HOST-5 Q6/Q8;
; owner ruling) scripts/install.sh stopped installing php-xdebug and
; stopped generating its own ini, and --update now DISARMS an enablement
; the old recipe left. The ${XDEBUG_MODE:-off} /
; ${XDEBUG_TRIGGER:-...} default-expansion syntax below IS live-capable
; (measured on PHP 8.3: unset env resolves to the default, set env wins),
; and docker/docker-entrypoint.sh pre-creates /tmp/xdebug for that same
; if-armed future. Production law unchanged: never arm debug/trace on a
; reachable host - see the XDEBUG_MODE row of the README Configuration
; reference.
; Default mode is OFF - use XDEBUG_MODE env var to enable
; Options: off, develop, trace, debug (can combine with comma: "develop,trace")
xdebug.mode = ${XDEBUG_MODE:-off}
xdebug.start_with_request = trigger
xdebug.trigger_value = "${XDEBUG_TRIGGER:-devdebug}"
xdebug.trace_output_dir = /tmp/xdebug
xdebug.max_nesting_level = 512
xdebug.collect_assignments = 1
xdebug.collect_return_value = 1
