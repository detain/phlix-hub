name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  composer-validate:
    name: Composer Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

  openapi:
    name: OpenAPI Description
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # S66. This job answers ONE question — is openapi.yaml a structurally
      # valid OpenAPI 3.1 document — and nothing else. Whether it still MATCHES
      # the hub's route table is a different question, answered by
      # tests/Unit/Http/RouteRegistration/OpenApiSpecMatchesRouterTest.php in the
      # phpunit job; a valid document that describes routes nobody registers is
      # exactly the S204 defect, and a linter cannot see it.
      #
      # The version is pinned, not floating: `recommended` is a moving ruleset,
      # so `@latest` would let an upstream release turn this red with no change
      # here. Rule deviations live in redocly.yaml, each with its reason.
      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@2.30.5 lint openapi.yaml

  snapshot-currency:
    name: Server Route Snapshot Currency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # S332. The S107 deny enumeration is re-derived from a VENDORED snapshot
      # of phlix-server's route table
      # (tests/Unit/Http/Controllers/Fixtures/phlix-server-route-manifest.json).
      # The deriving tests can only see the routes the snapshot contains, so a
      # snapshot that outlives the server is the SAME silent decay S107
      # suffered — S284's `regenerate-assets` was invisible because the tests
      # grew with the LIST, not with the ROUTES. This job is the drift
      # tripwire: it compares the snapshot's recorded source_sha against
      # phlix-server's live master and fails the build until the snapshot is
      # regenerated and the S332_EXPECTED_SERVER_SOURCE_SHA pin is bumped in
      # the SAME commit.
      #
      # phlix-server is public, so no token is needed for git ls-remote. A
      # network failure is a FAILURE, never a pass: a job that cannot measure
      # the other side must not report success (same rule as the S204
      # cross-repo check).
      - name: Compare snapshot source_sha against phlix-server master
        run: |
          SERVER_SHA="$(git ls-remote https://github.com/detain/phlix-server.git refs/heads/master | cut -f1)"
          FIXTURE_SHA="$(python3 -c 'import json; print(json.load(open("tests/Unit/Http/Controllers/Fixtures/phlix-server-route-manifest.json"))["source_sha"])')"
          echo "phlix-server master : ${SERVER_SHA:-<unreadable>}"
          echo "snapshot source_sha: $FIXTURE_SHA"
          [ -n "$SERVER_SHA" ] || { echo "::error::could not read phlix-server master from GitHub — nothing was compared"; exit 1; }
          [ "$SERVER_SHA" = "$FIXTURE_SHA" ] || {
            echo "::error::phlix-server master ($SERVER_SHA) has moved past the vendored route snapshot ($FIXTURE_SHA)."
            echo "::error::Regenerate the snapshot (php tests/Unit/Http/Controllers/Fixtures/dump-phlix-server-route-manifest.php <server-root>)"
            echo "::error::and bump S332_EXPECTED_SERVER_SOURCE_SHA in the SAME commit."
            exit 1
          }

  phpcs:
    name: PHP CodeSniffer (PSR-12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: json, pcntl, posix, openssl, curl, sodium, mbstring, hash, filter, ctype

      # S258. See the identical step in the phpunit job for why naming an
      # extension above is not, by itself, a gate.
      - name: Assert every security-path extension is loaded (S258)
        run: php scripts/assert-required-extensions.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # S299. This step used to be `./vendor/bin/phpcs --standard=PSR12 --colors
      # src/`, which (a) ignored phpcs.xml.dist entirely and (b) never looked at
      # tests/ — a tree that had NEVER been linted and carried 696 errors and 141
      # warnings across 69 of its 241 files while this check was green on every
      # commit since the workflow was written.
      #
      # ⚠ A gate that inspects zero files is indistinguishable from one that
      # passes: same exit 0, same green tick, less output. So the replacement does
      # not merely run the linter — it prints `N / N (100%) files inspected` per
      # path and fails below a hard-coded floor, and it takes its verdict from the
      # JSON report's totals rather than from phpcs's exit code, which lies.
      #
      # S109 still holds: warnings are gate failures here, not just errors.
      #
      # Do NOT replace this with a bare phpcs invocation, do NOT add
      # continue-on-error, and do NOT drop a <file> entry from phpcs.xml.dist:
      # tests/Unit/Support/PhpcsCorpusGateTest.php parses this file and the
      # ruleset and fails on each of those edits.
      - name: Run PHPCS over the whole corpus with an asserted file count (S299)
        run: php scripts/assert-phpcs-corpus.php

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: json, pcntl, posix, openssl, curl, sodium, mbstring, hash, filter, ctype

      # S258. See the identical step in the phpunit job for why naming an
      # extension above is not, by itself, a gate.
      - name: Assert every security-path extension is loaded (S258)
        run: php scripts/assert-required-extensions.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyze --no-progress --error-format=github

  psalm:
    name: Psalm Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          # swoole is required so Psalm can reflect \Swoole\Coroutine\Channel
          # used by PhlixMySQLConnection's per-connection coroutine mutex;
          # without it Psalm reports UndefinedClass at errorLevel 1.
          extensions: json, pcntl, posix, swoole, openssl, curl, sodium, mbstring, hash, filter, ctype

      # S258. See the identical step in the phpunit job for why naming an
      # extension above is not, by itself, a gate.
      - name: Assert every security-path extension is loaded (S258)
        run: php scripts/assert-required-extensions.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Psalm
        run: ./vendor/bin/psalm --no-progress --show-info=false

  phpunit:
    name: PHPUnit Test Suite
    runs-on: ubuntu-latest
    # S173: raised from 10. The 31 real-database tests each drop every table and
    # re-apply the whole 29-file migration chain in their setUp(), measured at
    # ~14 s per test against MySQL 8.0.46 (≈8 min for the Integration suite on
    # top of the unit suite). This is a failsafe, NOT a gate — do not lower it to
    # "fix" a slow run, and do not shorten the suite to fit it.
    timeout-minutes: 30

    # S173: without a real database every test under tests/Integration/ called
    # markTestSkipped() — all 31 of them, on every run since this workflow was
    # written, identically on master and on branches. Auth, login rate-limiting,
    # the migration chain and the relay throttle all have real-DB tests that had
    # NEVER executed here. A skipped test is not a neutral absence: phpunit exits
    # 0 with "OK, but some tests were skipped!" and the check goes green, so the
    # signal that nothing was verified looked exactly like success.
    # The "Assert the integration tests actually ran" step below makes that
    # impossible to repeat silently.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phlix_hub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          # S258: openssl and curl were relied on via setup-php's base build and
          # named NOWHERE, while AlexaSignatureMiddleware (S90) — the only
          # authentication the whole Alexa surface has — cannot verify a single
          # request without them. sodium (the Ed25519 enrollment JWT), mbstring,
          # hash, filter and ctype were in the same position. Naming them makes
          # the dependency a contract instead of an accident of the base image.
          #
          # ⚠ Naming is NOT a gate on its own: in the pinned setup-php,
          # src/scripts/unix.sh reads `fail_fast="${fail_fast:-${FAIL_FAST:-false}}"`
          # and only exits 1 when it is "true", so an extension it could not
          # install is a red cross in the log and a GREEN step. The
          # "Assert every security-path extension is loaded" step below is what
          # turns an absence into a failure.
          extensions: json, pcntl, posix, swoole, openssl, curl, sodium, mbstring, hash, filter, ctype
          coverage: xdebug

      # S258. Runs before `composer install` so a base image that lost an
      # extension fails in seconds, naming it, instead of surfacing later as a
      # confusing "undefined function openssl_verify()" inside a fail-closed
      # catch. Do NOT add continue-on-error and do NOT delete this step:
      # tests/Unit/Support/RequiredPhpExtensionsTest.php parses this file and
      # fails on either edit, and on any required extension dropped from the
      # `extensions:` list above.
      - name: Assert every security-path extension is loaded (S258)
        run: php scripts/assert-required-extensions.php

      - name: Build and enable php-uv
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libuv1-dev
          git clone --depth=1 https://github.com/bwoebi/php-uv.git /tmp/php-uv
          cd /tmp/php-uv && phpize && ./configure --with-uv && make -j"$(nproc)" && sudo make install
          echo "extension=uv.so" | sudo tee "$(php-config --ini-dir 2>/dev/null || php -i | awk -F'=> ' '/Scan this dir/{print $2}')/zz-uv.ini"

      - name: Verify swoole + uv loaded
        run: php -m | grep -iE '^(swoole|uv)$'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Apply database migrations
        # S173: applies the whole migrations/ chain forward against the service DB
        # with the standalone runner the deploy scripts use, so a migration that
        # cannot apply to an empty MySQL 8 database fails HERE rather than on a
        # production box. It is a genuine gate: MigrationRunner::applyFile()
        # rethrows any statement error and scripts/run-migrations.php exits 1 on it
        # (verified locally: an unreachable database exits 1, a replay of an
        # already-applied chain prints "Nothing to do" and exits 0). Do NOT add
        # `|| true` or `continue-on-error` — read the error and fix the migration.
        #
        # HUB_DB_* (not HUB_TEST_DB_*) because the runner reads
        # config/database.php. Scoped to this step so no unit test sees them.
        env:
          HUB_DB_HOST: 127.0.0.1
          HUB_DB_PORT: '3306'
          HUB_DB_USER: root
          HUB_DB_PASSWORD: root
          HUB_DB_NAME: phlix_hub_test
        run: php scripts/run-migrations.php

      - name: Run PHPUnit
        # Use php -d max_execution_time=0 to prevent PHP's default 30s timeout
        # which causes SIGALRM (exit 142) in long-running test suites with Xdebug coverage.
        #
        # S173: HUB_TEST_DB_* is what every tests/Integration/** case gates on —
        # without it they skip and this job goes green having proven nothing about
        # the real schema. Each of those tests drops all tables and re-runs the
        # migration chain in setUp(), so it is independent of the step above.
        # --log-junit feeds the assertion step that follows; it is the only way to
        # tell "ran" from "skipped" after the fact, since both exit 0.
        #
        # S316: --coverage-clover is likewise NOT decoration. Until S316 this
        # command passed no coverage flag at all, and coverage.xml existed solely
        # because of the <coverage><report><clover/> block in phpunit.xml — so
        # tidying one line of XML stopped all coverage reporting with the whole
        # pipeline still green (both uploaders below are non-failing by design).
        # Naming the file here makes the artifact depend on this command as well.
        #
        # Measured, not assumed: with the flag present PHPUnit emits Clover
        # exactly ONCE ("Generating code coverage report in Clover XML format"
        # appears one time), the <html> and <text> report targets configured in
        # phpunit.xml are unaffected, and pointing the flag at a different path
        # proves it OVERRIDES the XML target rather than adding a second one.
        #
        # S329: the suites are named EXPLICITLY (Unit + Integration), never the
        # implicit "all suites". phpunit.xml gained an E2E suite for the
        # live-session harness, and that suite only runs in the mcp-e2e job
        # that BOOTS the hub — a plain `phpunit` here would run its cases
        # against a non-existent hub, they would skip, and the whole-suite
        # zero-skip gate below would red the build. `--testsuite Unit
        # --testsuite Integration` is the same set this job always ran, stated
        # deliberately.
        env:
          HUB_TEST_DB_HOST: 127.0.0.1
          HUB_TEST_DB_PORT: '3306'
          HUB_TEST_DB_USER: root
          HUB_TEST_DB_PASSWORD: root
          HUB_TEST_DB_NAME: phlix_hub_test
        run: php -d max_execution_time=0 ./vendor/bin/phpunit --testsuite Unit --testsuite Integration --colors=always --coverage-clover coverage.xml --log-junit junit.xml

      - name: Assert the integration tests actually ran (S173)
        # ADDITIVE gate. It fails the build when any test was SKIPPED, and when
        # fewer than 31 real-database test cases executed — the second half exists
        # because "0 skipped" is also satisfiable by deleting the integration
        # tests. `if: always()` so a red suite still reports whether its real-DB
        # half ran at all, which is exactly when that is most informative.
        #
        # Do NOT delete this step, add continue-on-error to it, or drop the
        # --log-junit flag above: tests/Unit/Support/IntegrationDbCiWiringTest.php
        # parses this file and fails on each of those edits, on the removal of the
        # mysql service, and on a missing HUB_TEST_DB_* variable.
        if: always()
        run: php scripts/assert-integration-tests-ran.php junit.xml

      - name: Assert the coverage report exists and measured something (S316)
        # ADDITIVE gate, and it must stay BEFORE the two upload steps below.
        #
        # Until S316 a vanished coverage.xml was a silent green: no --coverage-*
        # flag on the PHPUnit command, `fail_ci_if_error: false` on Codecov and
        # `continue-on-error: true` on Codacy. Deleting one line from phpunit.xml
        # stopped all coverage reporting and nothing anywhere failed.
        #
        # The guard belongs HERE, on the local artifact, and NOT on the uploaders.
        # Do NOT "fix" this by setting `fail_ci_if_error: true` or by removing
        # Codacy's `continue-on-error`: that would make every unrelated PR depend
        # on a third party being reachable, and a gate that reds for someone
        # else's outage is the gate that gets deleted.
        #
        # The script asserts MAGNITUDE, not existence — byte count, file count,
        # statement count, covered count and the percentage, each printed and each
        # against a literal floor. A gate that ran and inspected zero files is
        # indistinguishable from a clean pass; that is the failure mode being
        # designed out, so the numbers are in the log on every run.
        #
        # Do NOT delete this step, add `continue-on-error`, or wrap it in an `if:`
        # that can be false — `if [ -f coverage.xml ]` around a check is exactly
        # the shape it exists to remove. `if: always()` is the only condition
        # allowed, because it cannot evaluate false.
        # tests/Unit/Support/CoverageArtifactGateTest.php parses this file and
        # fails on each of those edits, and drives the script's failure paths
        # against fixtures so a gate that can no longer fail is red too.
        run: php scripts/assert-coverage-report.php coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: phpunit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml

  composer-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'

      # S246 — this job used to run `composer install ... --no-dev` followed by a
      # bare `composer audit ... --no-dev`, which excluded every development
      # dependency from the audited set. It therefore reported SUCCESS on
      # 2026-08-06 against a lock pinning squizlabs/php_codesniffer 3.13.5, which
      # CVE-2026-67434 (HIGH, OS command injection) had just made vulnerable.
      #
      # The replacement audits the WHOLE lock and prints the corpus it examined.
      # Read scripts/security-audit-check.php for the policy and its reasoning.
      #
      # Do NOT re-introduce the development-dependency exclusion, do NOT add
      # continue-on-error to the step below, and do NOT wrap it in a conditional:
      # tests/Unit/Support/SecurityAuditCheckTest.php parses this file and fails
      # on each of those edits.
      - name: Run Security Audit (runtime AND development dependencies)
        run: php scripts/security-audit-check.php

  # --------------------------------------------------------------------------
  # S329 — THE live-session gate: a REAL MCP client against a RUNNING hub.
  # --------------------------------------------------------------------------
  # Until this job existed, the hub's MCP transport (S62/S63) had 14 unit test
  # files and no evidence from a real client: the SSE cases drive
  # RecordingStreamTimers and PHPUnit never enters the Workerman event loop,
  # so the timer/keep-alive claims say nothing about a live connection — the
  # same class of "verified against a double" as S57's caption tests.
  #
  # This job is the S57/S305 real-harness shape for the hub:
  #
  #   1. `scripts/ci-mcp-e2e-prereqs.php` fails CHEAPLY when a prerequisite is
  #      missing (node, the pinned @modelcontextprotocol/sdk, the extensions
  #      the hub needs to boot, the phpunit E2E wiring);
  #   2. the migration chain is applied to the MySQL service container;
  #   3. `scripts/mcp-e2e-seed.php` creates a user and mints PATs through the
  #      REAL McpTokenService, writing var/mcp-e2e-tokens.json;
  #   4. the hub BOOTS (start.php -d) with HUB_MCP_PLAYBACK_CONTROL=true so
  #      the write-scoped playback_control tool is registered;
  #   5. `tests/E2E/Mcp/McpClientSseE2ETest` drives the official MCP SDK
  #      client through full SSE sessions: initialise → tools/list → one tool
  #      call → clean close, plus the denied-scope case and the
  #      broken-transport negative control;
  #   6. `if: always()` `scripts/assert-mcp-e2e-ran.php junit-mcp.xml` reads
  #      the JUnit report and fails when any required case is absent or
  #      skipped — a skipped test reads as a pass, which is the whole defect.
  #
  # ⚠ THIS JOB HAS NO `needs:`, DELIBERATELY, AND MUST NOT ACQUIRE ONE.
  # GitHub's response to a failed dependency is to SKIP the dependents, and a
  # skipped job counts as SUCCESS to the checks API — with no branch protection
  # anywhere in this estate, a merge decision taken on "nothing failed" would
  # ship a PR whose live-session gate never ran. That is the exact failure
  # mode this job exists to remove (the same rule docker-boot-gate documents).
  # Also do NOT add `continue-on-error` to the E2E run or the gate step:
  # tests/Unit/Support/McpE2ECiWiringTest.php parses this file and fails on
  # each of those edits, on a missing mysql service, on a dropped HUB_DB_*
  # variable, and on any `needs:` appearing in this job.
  #
  # node is NOT pinned via actions/setup-node: ubuntu-latest ships node >= 20,
  # and the prereqs script ASSERTS the version instead of assuming it — a
  # future runner image that drops node reds the job HERE, named, rather than
  # three silently-skipped tests later.
  mcp-e2e:
    name: Real MCP Client SSE Session
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phlix_hub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          # S258: the same security-path extension set the other PHP jobs
          # carry. swoole + uv are what the hub's boot path needs (see the
          # php-uv build step below), and the prereqs script re-asserts them.
          extensions: json, pcntl, posix, swoole, openssl, curl, sodium, mbstring, hash, filter, ctype

      - name: Assert every security-path extension is loaded (S258)
        run: php scripts/assert-required-extensions.php

      - name: Build and enable php-uv
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libuv1-dev
          git clone --depth=1 https://github.com/bwoebi/php-uv.git /tmp/php-uv
          cd /tmp/php-uv && phpize && ./configure --with-uv && make -j"$(nproc)" && sudo make install
          echo "extension=uv.so" | sudo tee "$(php-config --ini-dir 2>/dev/null || php -i | awk -F'=> ' '/Scan this dir/{print $2}')/zz-uv.ini"

      - name: Verify swoole + uv loaded
        run: php -m | grep -iE '^(swoole|uv)$'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # S329: the SDK is installed PINNED from the committed package-lock.json
      # (exact version + integrity). A bare `npm install` would float the
      # version and silently change what the probe proves.
      - name: Install the pinned MCP SDK client
        working-directory: tests/E2E/Mcp
        run: npm ci

      - name: Assert the MCP E2E prerequisites (S329)
        run: php scripts/ci-mcp-e2e-prereqs.php

      - name: Apply database migrations
        # HUB_DB_* (not HUB_TEST_DB_*) because scripts/run-migrations.php and
        # scripts/mcp-e2e-seed.php resolve their target through
        # config/database.php, which reads HUB_DB_*.
        env:
          HUB_DB_HOST: 127.0.0.1
          HUB_DB_PORT: '3306'
          HUB_DB_USER: root
          HUB_DB_PASSWORD: root
          HUB_DB_NAME: phlix_hub_test
        run: php scripts/run-migrations.php

      - name: Seed the MCP E2E user and mint PATs (S329)
        # Mints a user + two PATs through the REAL McpTokenService and writes
        # var/mcp-e2e-tokens.json. Exits 1 when a mint does not round-trip
        # through validate() — a gate that cannot seed cannot measure.
        env:
          HUB_DB_HOST: 127.0.0.1
          HUB_DB_PORT: '3306'
          HUB_DB_USER: root
          HUB_DB_PASSWORD: root
          HUB_DB_NAME: phlix_hub_test
        run: php scripts/mcp-e2e-seed.php

      - name: Boot the hub
        env:
          HUB_DB_HOST: 127.0.0.1
          HUB_DB_PORT: '3306'
          HUB_DB_USER: root
          HUB_DB_PASSWORD: root
          HUB_DB_NAME: phlix_hub_test
          HUB_PORT: '8800'
          HUB_WORKERS: '1'
          # Registers playback_control — the write tool the denied-scope case
          # needs to exist in tools/list (default OFF is the production value,
          # but a denied scope is only observable when the tool is registered).
          HUB_MCP_PLAYBACK_CONTROL: 'true'
        run: |
          set -euo pipefail
          php start.php start -d
          # Readiness = the app is booted AND the route is registered: an
          # unauthenticated POST /mcp must answer 401 (auth.required) — that
          # 401 happens before any limiter or DB touch, so it proves the worker
          # is serving without depending on the seed.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8800/mcp || true)"
            if [ "$code" = "401" ]; then
              echo "hub is ready (POST /mcp answered $code) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::hub did not become ready on :8800 in 60s — see the workerman log"
          cat .logs/workerman.log 2>/dev/null || true
          exit 1

      - name: Run the real MCP client SSE session suite
        env:
          HUB_MCP_E2E_BASE_URL: http://127.0.0.1:8800
          HUB_MCP_E2E_TOKENS_FILE: var/mcp-e2e-tokens.json
        run: php -d max_execution_time=0 ./vendor/bin/phpunit --colors=always --testsuite E2E --log-junit junit-mcp.xml

      - name: Assert the MCP live-session cases actually ran (S329)
        # ADDITIVE gate: fails when a required case is absent, skipped, or
        # asserted nothing. `if: always()` so a red suite still reports whether
        # its live-session half ran at all. Do NOT delete this step, do NOT add
        # continue-on-error, do NOT wrap it in an `if:` that can be false:
        # tests/Unit/Support/McpE2ECiWiringTest.php parses this file and fails
        # on each of those edits.
        if: always()
        run: php scripts/assert-mcp-e2e-ran.php junit-mcp.xml

      - name: Stop the hub (cleanup)
        # Hygiene only, never a gate: `|| true` is correct here because a job
        # that redded earlier still deserves to stop its daemon.
        if: always()
        run: php start.php stop || true
