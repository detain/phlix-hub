      operationId: "post_api_v1_servers_id_relay"
      tags: ["Relay"]
      summary: "Relay tunnel signpost"
      description: |-
        HTTP signpost only. The tunnel itself is a WebSocket on `:8802` — this endpoint answers 501
        with an `X-WS-Endpoint` header naming it. phlix-server addresses this path from
        `config/relay.php` `hub_wss_url`. Authenticates inside the controller.
      x-phlix-middleware: []
      parameters:
        - name: "id"
          in: path
          required: true
          description: "Resource id (8-4-4-4-12 hex UUID)."
          schema:
            type: string
      security: []
      responses:
        "501":
          description: |-
            Always. The relay tunnel is not an HTTP endpoint; the response body and the `X-WS-Endpoint`
            header name the `:8802` WebSocket to connect to instead.
          headers:
            X-WS-Endpoint:
              description: "WebSocket URL of the relay tunnel, e.g. `ws://hub.phlix.tv:8802`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelaySignpost"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
