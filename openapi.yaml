# ---------------------------------------------------------------------------
# WebSocket surfaces.
#
# These are NOT OpenAPI `paths`. The server relay tunnel mounts at the bare root
# of :8802, and its path key `/` is already taken by the HTTP redirect on :8800;
# OpenAPI path keys are global, so the two cannot coexist without one of them
# lying about its port. Modelling them as an extension keeps every entry in
# `paths` an honest :8800 HTTP operation, which is also what makes the exact
# spec-vs-router bijection possible.
#
# `port` on each hub surface is machine-checked against the PHP source in
# tests/Unit/Http/RouteRegistration/OpenApiSpecMatchesRouterTest.php. The
# phlix-server surface below is NOT checkable from this repository's CI (it
# clones one repo); it is marked `repo: phlix-server` and is documentation only.
#
# Full message and frame catalogs: docs/websockets.md
# ---------------------------------------------------------------------------
x-phlix-websockets:
  - name: "Server relay tunnel"
    repo: phlix-hub
    port: 8802
    portSource: "config/server.php `relay_port` (default 8802); Application::run()"
    url: "ws://hub.phlix.tv:8802"
    path: "/"
    worker: "Phlix\\Hub\\Relay\\RelayWorker"
    direction: "media server → hub (outbound, so it traverses NAT)"
    auth: >-
      JSON HELLO frame as the first message, carrying the Ed25519 enrollment JWT and the server id.
      The hub answers HELLO_ACK with a relay session id and a tunnel id, after which the socket is
      binary. A connect-rate limiter (10/60s per IP) closes with code 1013 before HELLO is read.
    encoding: "JSON text for HELLO/HELLO_ACK, then binary RelayFrame"
    wireFormat: >-
      [4-byte channel or request id (uint32, big-endian)][1-byte frame type][2-byte payload length
      (uint16)][N payload bytes]. Maximum payload 65535 bytes.
    messages:
      - "0x01 HELLO — server→hub, JSON, channel 0"
      - "0x02 HELLO_ACK — hub→server, JSON, channel 0"
      - "0x03 CLIENT_CONNECT — hub→server, channel = new client channel id"
      - "0x04 CLIENT_DISCONNECT — hub→server, channel = that client's channel id"
      - "0x05 DATA — bidirectional, raw bytes forwarded verbatim, channel = owning client"
      - "0x06 HEARTBEAT — either direction, keep-alive, channel 0"
      - "0x07 DISCONNECTED — hub→client, tunnel closed, channel 0"
      - "0x08 ERROR — any direction, channel 0"
      - "0x10 HTTP_REQUEST — hub→server, one proxied HTTP request, 4-byte field = request id"
      - "0x11 HTTP_RESPONSE — server→hub, tagged HEAD/BODY/END chunks for that request id"
      - "0x12 HTTP_CANCEL — hub→server, the client abandoned that request id, empty payload"
    closeCodes:
      - "1013 — connect rate limit exceeded; back off and reconnect"
  - name: "Client mount"
    repo: phlix-hub
    port: 8803
    portSource: "Phlix\\Hub\\Relay\\ClientRelayWorker::DEFAULT_PORT"
    url: "ws://hub.phlix.tv:8803/client/{server_id}"
    path: "/client/{server_id}"
    pathPattern: "~^/client/([^/?#]+)/?(?:[?#].*)?$~"
    worker: "Phlix\\Hub\\Relay\\ClientRelayWorker"
    direction: "client → hub, bridged onto the target server's :8802 tunnel"
    auth: >-
      A per-user client relay token from POST /api/v1/me/servers/{id}/relay-token, presented as
      `Authorization: Bearer <token>` or as `Sec-WebSocket-Protocol: bearer, <token>` (browsers
      cannot set arbitrary headers on a WebSocket). The `?token=` query form was REMOVED in step
      S2b so credentials never reach access logs. The token must be scoped to the path-derived
      server_id, and the resolved user must still own that server.
    encoding: "binary RelayFrame (same wire format as :8802)"
    messages:
      - "0x05 DATA — bidirectional payload, multiplexed onto this client's channel id"
      - "0x07 DISCONNECTED — hub→client, the server tunnel went away; reconnect"
      - "0x08 ERROR — hub→client"
    notes: >-
      GET /client/{server_id} also exists on the :8800 HTTP surface as a signpost. It is
      deliberately registered WITHOUT the /api/v1 prefix so the HTTP mirror names exactly the path
      this worker's regex parses.
  - name: "SyncPlay relay"
    repo: phlix-hub
    port: 8804
    portSource: "Phlix\\Hub\\SyncPlay\\SyncPlayRelayWorker::DEFAULT_PORT"
    url: "ws://hub.phlix.tv:8804/syncplay/{server_id}"
    path: "/syncplay/{server_id}"
    pathPattern: "~^/syncplay/([^/?#]+)/?(?:[?#].*)?$~"
    worker: "Phlix\\Hub\\SyncPlay\\SyncPlayRelayWorker"
    direction: "client ↔ hub, broadcast to every client in the same room"
    auth: >-
      A client relay token, validated by ClientRelayTokenService and required to be bound to the
      path-derived server_id. Since step S237 the token is carried EXACTLY as on :8803 —
      `Authorization: Bearer <token>` or `Sec-WebSocket-Protocol: bearer, <token>`, extracted by
      the shared ClientRelayWorker::extractClientToken(). The `?token=` query form is not accepted.
      ⚠ Before S237 this worker read `$_GET['token']`, which was wrong twice: it documented a live
      credential in a query string, and Workerman 5 never populates that superglobal, so the read
      was always null and EVERY :8804 connect was rejected. A client still sending `?token=` here
      was never authenticating and must move the token to a header or the bearer subprotocol.
    encoding: "JSON text frames"
    messages:
      - "client→hub group_join — join a room; the room key is scoped to (server_id, owner)"
      - "client→hub group_leave — leave the current room"
      - "client→hub playback_play / playback_pause / playback_seek — broadcast playback control"
      - "client→hub time_sync — clock probe"
      - "hub→client room_state — the room's members and current playback state after a join"
      - "hub→client client_joined / client_left — membership change"
      - "hub→client time_sync_reply — clock probe answer"
    notes: >-
      Any message type not in the list above is relayed verbatim to the rest of the room, so the
      catalog is a floor, not a closed set.
  - name: "Hub federation"
    repo: phlix-hub
    port: 8805
    portSource: "Phlix\\Hub\\Relay\\FederationWorker::DEFAULT_PORT"
    url: "ws://master-hub.example:8805/relay/federation/{hub_id}"
    path: "/relay/federation/{hub_id}"
    pathPattern: "~^/relay/federation/([^/?#]+)/?(?:[?#].*)?$~"
    worker: "Phlix\\Hub\\Relay\\FederationWorker"
    direction: "leaf hub → master hub"
    auth: >-
      The hub_id in the path must already be a known peer in `federation_peers`; an unknown id is
      closed with reason "Unknown hub". The worker is started pre-fork from
      HubServicesProvider::boot(), because a Workerman Worker must be constructed before runAll().
    encoding: "JSON text for HUB_HELLO/HUB_HELLO_ACK, then binary RelayFrame"
    messages:
      - "0x09 HUB_HELLO — leaf→master, JSON, channel 0"
      - "0x0A HUB_HELLO_ACK — master→leaf, JSON, channel 0"
      - "0x0B HUB_HEARTBEAT — either direction, keep-alive, channel 0"
      - "0x0C LIBRARY_SHARE_UPDATE — master→leaf, JSON, channel 0"
      - "0x0D LIBRARY_SHARE_REVOKED — master→leaf, JSON, channel 0"
      - "0x0E ADMIN_DELEGATION — master→leaf, JSON, channel 0"
      - "0x0F HUB_DISCONNECTED — either direction, clean close, channel 0"
  - name: "Media server events and SyncPlay"
    repo: phlix-server
    port: 8097
    portSource: "phlix-server config/server.php websocket.port"
    url: "ws://media-server:8097/"
    path: "/"
    worker: "Phlix\\Server\\WebSocket\\WebSocketServer"
    direction: "client ↔ media server (direct, or tunnelled through this hub)"
    auth: >-
      The socket accepts unauthenticated connections and immediately sends `connected`. Only
      ping, pong, auth_request and connected may be sent before authenticating; every other type
      (and every `syncplay_*` type) requires an authenticated connection.
    encoding: "JSON text frames"
    envelope: >-
      {"type": "<event>", "data": {...}, "timestamp": <unix seconds>} for normal events; SyncPlay
      control messages use the flat form {"type": "<event>", ...payload, "timestamp": <unix>}.
      Inbound messages are read as {"type": ..., "data": ...}.
    messages:
      - "connected / disconnected / client_disconnected"
      - "auth_request / auth_success / auth_failure"
      - "session_start / session_end / session_join / session_leave"
      - "playback_start / playback_pause / playback_stop / playback_progress / playback_seek"
      - "syncplay_create_group / syncplay_join_group / syncplay_leave_group"
      - "syncplay_sync_state / syncplay_sync_request"
      - "subscribe_dashboard / dashboard_now_playing"
      - "library_updated / notification / error / ping / pong"
    notes: >-
      Documented here for completeness because a hub client reaches this socket through the relay.
      It belongs to phlix-server and is NOT verified by this repository's tests.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A hub user access token (HS256), minted by POST /api/v1/auth/login or /refresh. Enforced by
        AuthMiddleware. On an /api/ path a missing or invalid token is a JSON 401 with code
        `auth.required`; on a page path it is a 302 to /app/login.
    enrollmentJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An Ed25519 enrollment JWT issued to a claimed media server. Enforced by
        EnrollmentJwtMiddleware; the verification keys are published at /.well-known/jwks.json.
    mcpToken:
      type: http
      scheme: bearer
      description: >-
        An MCP personal access token (S62), minted by POST /api/v1/me/mcp-tokens and accepted ONLY
        by POST and GET /mcp. It is an opaque `phlix-mcp-`-prefixed CSPRNG string, not a JWT — the hub stores
        only its SHA-256 hash. Validated by McpController itself rather than by AuthMiddleware, which
        is why /mcp carries an empty x-phlix-middleware.
  parameters:
    AcceptPhlixProtocol:
      name: Accept-Phlix-Protocol
      in: header
      required: true
      description: >-
        Hub wire protocol version. HubProtocolMiddleware rejects a missing or unsupported value with
        400 before any handler runs, so this is a protocol error and not an auth error.
      schema:
        type: string
        const: v1
  responses:
    Unauthorized:
      description: "No credentials, or credentials the middleware rejected."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Unauthorized
            code: auth.required
    EnrollmentRequired:
      description: "No valid Ed25519 enrollment JWT for the server named in the path."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Authenticated, but not an administrator of this hub."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No such resource, or it is not visible to the caller."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProtocolRequired:
      description: "The Accept-Phlix-Protocol header was absent or named an unsupported version."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >-
        A per-surface rate limit was exceeded. Application::rateLimitResponse() adds Retry-After
        with the seconds remaining in the window.
      headers:
        Retry-After:
          description: "Seconds until the limiter window resets. Never negative."
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too Many Requests
            code: rate_limited
  schemas:
    Error:
      type: object
      description: "The flat error envelope every hub controller returns."
      required: [error]
      properties:
        error:
          type: string
          description: "Human-readable summary."
        code:
          type: string
          description: "Stable machine code, e.g. `auth.required`, `user.not_found`, `rate_limited`."
      additionalProperties: true
    Uuid:
      type: string
      description: "8-4-4-4-12 hex UUID, stored as CHAR(36)."
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    Health:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: phlix-hub
        version:
          type: string
          description: "Phlix\\Hub\\Version::VERSION."
        phlixShared:
          type: string
          description: "Version of the shared detain/phlix-shared package."
        timestamp:
          type: integer
          description: "Unix seconds."
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
          format: email
        name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
      additionalProperties: true
    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
      additionalProperties: true
    AuthSession:
      type: object
      description: "A minted session. The refresh token is also set as a cookie."
      properties:
        access_token:
          type: string
          description: "HS256 bearer token for the /api/v1 surface."
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: "Access-token lifetime in seconds."
        user:
          $ref: "#/components/schemas/User"
      additionalProperties: true
    MeResponse:
      type: object
      description: "MeController: the user, the decoded JWT claims, and the servers they own."
      properties:
        user:
          $ref: "#/components/schemas/User"
        claims:
          type: object
          additionalProperties: true
        servers:
          type: array
          items:
            $ref: "#/components/schemas/Server"
      additionalProperties: true
    Server:
      type: object
      description: "A claimed media server as the hub knows it."
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        online:
          type: boolean
          description: "Derived from the last heartbeat, not from a live probe."
        last_seen:
          type: string
        subdomain:
          type: string
          description: "Allocated <name>.phlix.tv, if any."
        version:
          type: string
      additionalProperties: true
    ServerList:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/Server"
      additionalProperties: true
    ServerClaim:
      type: object
      description: "Issued to a server that is starting a claim."
      properties:
        claim_id:
          type: string
          description: "Unguessable bearer secret the server polls with."
        claim_code:
          type: string
          description: "Short code the operator pastes into the hub UI."
        expires_at:
          type: string
      additionalProperties: true
    ServerClaimStatus:
      type: object
      properties:
        status:
          type: string
          description: "pending, approved, or expired."
        enrollment_jwt:
          type: string
          description: "Present once approved: the Ed25519 JWT the server authenticates with."
        server_id:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: true
    Jwks:
      type: object
      description: "RFC 7517 JWK Set holding the hub's Ed25519 enrollment verification keys."
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
                const: OKP
              crv:
                type: string
                const: Ed25519
              kid:
                type: string
              x:
                type: string
                description: "base64url public key."
            additionalProperties: true
    RelayToken:
      type: object
      description: "Short-lived token for mounting ws://hub:8803/client/{server_id}."
      properties:
        token:
          type: string
        expires_at:
          type: string
        server_id:
          $ref: "#/components/schemas/Uuid"
        ws_url:
          type: string
      additionalProperties: true
    McpScope:
      type: string
      description: >-
        A capability an MCP token may carry. The set is closed; unknown values are dropped rather
        than stored, so a typo becomes "no scope" (fail closed) instead of a scope that silently
        matches nothing later. The order below is the order the hub emits scopes in — it is part of
        the stored representation, so appending is safe and reordering is not.
      enum:
        - "mcp:servers:read"
        - "mcp:library:read"
        - "mcp:playback:read"
        - "mcp:playback:control"
    McpTokenMintRequest:
      type: object
      description: "Body of POST /api/v1/me/mcp-tokens."
      properties:
        name:
          type: string
          maxLength: 191
          description: "Operator-supplied label shown in the token list. Optional."
        scopes:
          type: array
          description: >-
            Scopes to grant. **Omitting this field grants the READ-ONLY set** — `mcp:servers:read`,
            `mcp:library:read`, `mcp:playback:read` — and never the write scope
            `mcp:playback:control`. That is a default, not a ban: send
            `mcp:playback:control` explicitly and it is granted, whether or not the operator has
            enabled the `playback_control` tool. Unknown members are dropped; a list with nothing
            known left in it is a 400 rather than a token that authorises nothing.
            (Before 2026-08-07 omitting this field granted EVERY scope including the write one, so
            tokens minted before then may carry `mcp:playback:control` unintentionally.)
          items:
            $ref: "#/components/schemas/McpScope"
      additionalProperties: false
    McpTokenMinted:
      type: object
      description: "201 body of POST /api/v1/me/mcp-tokens. The only place the plaintext ever appears."
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        token:
          type: string
          description: >-
            The plaintext, prefixed `phlix-mcp-`. Shown ONCE — only its SHA-256 hash is stored, so
            it cannot be retrieved again. Present it to POST /mcp as `Authorization: Bearer`.
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/McpScope"
        expires_at:
          type: integer
          description: "Absolute Unix expiry. Always finite; the default lifetime is 90 days."
      additionalProperties: true
    McpTokenSummary:
      type: object
      description: "One row of GET /api/v1/me/mcp-tokens. Never carries the token or its hash."
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/McpScope"
        created_at:
          type: integer
        expires_at:
          type: integer
        last_used_at:
          type: [integer, "null"]
        revoked:
          type: boolean
        expired:
          type: boolean
      additionalProperties: true
    McpTokenList:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/McpTokenSummary"
        available_scopes:
          type: array
          description: >-
            The scopes this deployment advertises as useful right now — a SUBSET of `McpScope`, not
            the whole vocabulary. `mcp:playback:control` is omitted unless the operator has enabled
            the `playback_control` tool, because with the flag off that tool is not registered and
            the scope names something the server answers `mcp.unknown_tool` for. This list is an
            advertisement, not a validation set: `POST /api/v1/me/mcp-tokens` still grants
            `mcp:playback:control` when it is asked for explicitly.
          items:
            $ref: "#/components/schemas/McpScope"
      additionalProperties: true
    JsonRpcRequest:
      type: object
      description: >-
        A single JSON-RPC 2.0 request. Batches (a top-level array) are refused. A request with no
        `id` is a notification and is answered with an empty 202.
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          type: [string, integer]
        method:
          type: string
          description: "One of: initialize, ping, tools/list, tools/call."
        params:
          type: object
          additionalProperties: true
      required: [method]
      additionalProperties: true
    JsonRpcResponse:
      type: object
      description: >-
        A JSON-RPC 2.0 response. Exactly one of `result` / `error` is present. `id` is echoed, or
        null when it could not be determined (JSON-RPC 2.0 §5).
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          type: [string, integer, "null"]
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
              description: "-32700 parse, -32600 invalid request, -32601 unknown method, -32602 bad params."
            message:
              type: string
            data:
              type: object
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    RelaySignpost:
      type: object
      description: "Body of the 501 answered by POST /api/v1/servers/{id}/relay."
      properties:
        error:
          type: string
        message:
          type: string
          description: "Names the ws:// endpoint to connect to instead."
        ws_endpoint:
          type: string
      additionalProperties: true
    BandwidthUsage:
      type: object
      properties:
        bytes_used:
          type: integer
        quota_bytes:
          type: integer
          description: "0 or null means unlimited."
        throttle_bps:
          type: integer
          description: "Per-user relay byte rate enforced by TokenBucket. 0 means unthrottled."
        window_start:
          type: string
      additionalProperties: true
    MediaRequest:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        type:
          type: string
        status:
          type: string
          description: "pending, approved, or denied."
        requested_by:
          $ref: "#/components/schemas/Uuid"
        created_at:
          type: string
      additionalProperties: true
    MediaRequestList:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/MediaRequest"
      additionalProperties: true
    LibraryShare:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        server_id:
          $ref: "#/components/schemas/Uuid"
        library_id:
          type: string
        shared_with:
          $ref: "#/components/schemas/Uuid"
        permissions:
          type: object
          additionalProperties: true
      additionalProperties: true
    LibraryShareList:
      type: object
      properties:
        shares:
          type: array
          items:
            $ref: "#/components/schemas/LibraryShare"
      additionalProperties: true
    InviteLink:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        token:
          type: string
        expires_at:
          type: string
        max_uses:
          type: integer
        uses:
          type: integer
      additionalProperties: true
    InviteLinkList:
      type: object
      properties:
        invite_links:
          type: array
          items:
            $ref: "#/components/schemas/InviteLink"
      additionalProperties: true
    HubSettings:
      type: object
      description: "Instance-wide settings row, exposed on both the /me and /admin paths."
      additionalProperties: true
    FederationHubConfig:
      type: object
      description: "This hub's own federation identity and role (master or leaf)."
      additionalProperties: true
    FederationPeer:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        hub_url:
          type: string
        relay_enabled:
          type: boolean
        admin_delegation_enabled:
          type: boolean
        status:
          type: string
      additionalProperties: true
    FederationPeerList:
      type: object
      properties:
        peers:
          type: array
          items:
            $ref: "#/components/schemas/FederationPeer"
      additionalProperties: true
