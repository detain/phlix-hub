# phlix-hub OpenAPI description (S66).
#
# ⚠ THIS FILE IS HAND-MAINTAINED AND MACHINE-CHECKED.
#
# `paths` must be an EXACT bijection with the route table
# `Application::registerRoutes()` composes, including each operation's
# middleware chain. That is enforced by
# tests/Unit/Http/RouteRegistration/OpenApiSpecMatchesRouterTest.php, which
# drives the REAL registrars and fails on any route present in one artefact
# and not the other. Adding, moving or re-gating a route therefore requires
# editing this file in the same commit.
#
# Two extensions carry the machine-checked facts:
#   x-phlix-middleware  the route's middleware chain, in order, by class
#                       short name. `[]` means deliberately ungated.
#   x-phlix-route       present only when the router template differs from
#                       the OpenAPI path (OpenAPI has no `{name:regex}`
#                       form). The test compares THIS, not a normalised
#                       path, so no constraint change is hidden.
#
# WebSocket surfaces are NOT `paths`: the server tunnel mounts at the bare
# root of :8802, whose path key `/` is already taken by the HTTP SPA
# redirect on :8800. They live under the root `x-phlix-websockets`
# extension instead, with the full catalog in docs/websockets.md.

openapi: 3.1.0
info:
  title: "Phlix Hub API"
  version: "1.0.0"
  summary: "Multi-server cloud directory and reverse-tunnel relay for Phlix media servers."
  description: |-
    `phlix-hub` is the central directory a Phlix media server enrolls with, and the reverse tunnel
    through which a client reaches that server when it sits behind NAT. It is NOT the media server:
    library scanning, transcoding, HLS, DLNA and Live TV all live in `phlix-server` and are
    described by that repository's own specification.

    ## Surfaces

    - **`:8800` HTTP** — everything in `paths` below. Behind HAProxy in production.
    - **`:8802` WebSocket** — the media server's outbound relay tunnel.
    - **`:8803` WebSocket** — a client mounting a server through that tunnel.
    - **`:8804` WebSocket** — SyncPlay rooms relayed between clients.
    - **`:8805` WebSocket** — hub-to-hub federation (master side).

    The four WebSocket surfaces are described under the root `x-phlix-websockets` extension; their
    message and frame catalogs are in `docs/websockets.md`, which also covers `phlix-server`'s own
    `:8097` SyncPlay/events socket.

    ## Conventions

    Errors are a flat JSON envelope: `{"error": "<human text>", "code": "<machine code>"}`. Ids are
    8-4-4-4-12 hex UUIDs stored as `CHAR(36)`.

    Three distinct credentials appear here. A **user** bearer token is HS256 and is what the SPA and
    clients send. An **enrollment JWT** is Ed25519 and is what an enrolled media server sends; its
    public keys are published at `/.well-known/jwks.json`. A **client relay token** is minted by
    `POST /api/v1/me/servers/{id}/relay-token` and is presented only on the `:8803` WebSocket.

    Server-facing endpoints additionally require the `Accept-Phlix-Protocol: v1` header where
    `HubProtocolMiddleware` is in the chain; a missing or wrong value is a 400, not a 401.
  license:
    name: "MPL-2.0"
    identifier: "MPL-2.0"
  contact:
    name: "Phlix"
    url: "https://github.com/detain/phlix-hub"

servers:
  - url: "https://hub.phlix.tv"
    description: "Production hub."
  - url: "http://localhost:8800"
    description: "Local development (Workerman HTTP worker, unproxied)."

tags:
  - name: "Health"
    description: "Unauthenticated liveness surface."
  - name: "Web UI"
    description: "The `/app` Vue SPA shell plus the legacy server-rendered page paths, which now only redirect into it."
  - name: "Authentication"
    description: "Account creation, login, token refresh, and the current-user endpoints."
  - name: "My Servers"
    description: "A signed-in user's view of the media servers they have claimed."
  - name: "Server Proxy"
    description: "Authenticated HTTP proxied to a claimed server over its relay tunnel."
  - name: "Server Enrollment"
    description: "The claim/enroll/heartbeat lifecycle a media server drives, authenticated with an Ed25519 enrollment JWT."
  - name: "Relay"
    description: "HTTP signposts for the WebSocket relay surfaces. The tunnels themselves are not HTTP."
  - name: "Media Requests"
    description: "User requests for missing media, and the admin queue that approves them."
  - name: "Bandwidth and Quota"
    description: "Per-user relay byte accounting, monthly quota, and throttle."
  - name: "Library Sharing"
    description: "Sharing a library from one hub user to another."
  - name: "Invite Links"
    description: "Tokenised invitations that grant shares on redemption."
  - name: "Hub Settings"
    description: "Instance-wide settings. Admin only."
  - name: "Logs and Audit"
    description: "Log channel listing/tailing and the audit trail. Admin only."
  - name: "Admin Users"
    description: "User administration."
  - name: "Hub Administration"
    description: "Restart, update channel, and the admin dashboard."
  - name: "Federation"
    description: "Hub-to-hub peering, federated library offers, and admin delegation."
  - name: "Relay Metrics"
    description: "Relay counters, history, live connections, and per-route HTTP metrics."
  - name: "MCP"
    description: >-
      The Model Context Protocol endpoint an AI client talks to, plus the personal access tokens
      that authenticate it. Read-only, and gated by the same server-ownership checks as the relay
      proxy.
  - name: "Alexa"
    description: >-
      The self-hosted Amazon Alexa custom skill endpoint. Answers questions about a linked user's
      library and returns a LINK when asked to play something; it cannot start, stop or route
      playback on any device, and it cannot cast.

paths:
  "/":
    get:
      operationId: "get_root"
      tags: ["Web UI"]
      summary: "Root redirect"
      description: |-
        Legacy server-rendered page path. The Smarty UI was retired; this path 302-redirects into the
        Vue SPA under `/app`.
      x-phlix-middleware: []
      security: []
      responses:
        "302":
          description: |-
            Redirect into the SPA at `/app/servers`.
          headers:
            Location:
              description: "/app/servers"
              schema:
                type: string
  "/.well-known/jwks.json":
    get:
      operationId: "get_well_known_jwks_json"
      tags: ["Server Enrollment"]
      summary: "Hub JWKS"
      description: |-
        Public Ed25519 verification keys for the enrollment JWTs the hub mints. Public and
        cache-frontable.
      x-phlix-middleware: []
      security: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
  "/admin/requests":
    get:
      operationId: "get_admin_requests"
      tags: ["Web UI"]
      summary: "Legacy admin media-requests page"
      description: |-
        Legacy server-rendered page path. The Smarty UI was retired; this path 302-redirects into the
        Vue SPA under `/app`.
      x-phlix-middleware: [AuthMiddleware, AdminMiddleware]
      security:
        - bearerAuth: []
      responses:
        "302":
          description: |-
            Always a redirect, but to one of two places. Signed in: `/app/admin/requests`. Not signed in:
            `AuthMiddleware` short-circuits first and answers a non-`/api/` path with `/app/login` rather
            than a JSON 401, so a browser is bounced to the login page.
          headers:
            Location:
              description: "/app/admin/requests when signed in, /app/login when not"
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  "/alexa/skill":
    post:
      operationId: "post_alexa_skill"
      tags: ["Alexa"]
      summary: "Amazon Alexa custom skill endpoint"
      description: |-
        The Phlix Alexa skill, served by the SAME `:8800` HTTP worker as everything else in this
        description — a self-hosted HTTPS endpoint, not a Lambda and not a Smart Home skill.

        ## Authentication

        `x-phlix-middleware` is `[AlexaSignatureMiddleware]`, and that gate is the only thing between
        this public path and the internet. Amazon's proof of origin is a detached RSA signature over
        the RAW request bytes, sent in `Signature-256`, made with a certificate published under
        `https://s3.amazonaws.com/echo.api/` and named in `SignatureCertChainUrl`. The middleware
        validates that URL BEFORE fetching it, verifies the chain anchors to a trusted root, checks
        the leaf's `echo-api.amazon.com` SAN, verifies the signature over the raw bytes, and only
        then enforces Amazon's 150-second replay window. The legacy SHA-1 `Signature` header is
        deliberately NOT accepted: honouring it would let a caller downgrade the gate to a broken
        hash by choosing which header to send.

        There is no `AuthMiddleware` here, on purpose. An Alexa request carries no hub session.

        ## Authorisation

        The caller's identity is the linked-account bearer token inside the JSON body
        (`session.user.accessToken` / `context.System.user.accessToken`), resolved to a hub user by
        `AlexaAccountLink`. An absent or unresolvable token is answered with a `LinkAccount` card and
        spoken prompt — never a 401, which an Alexa device cannot present to a user.

        Every library read is dispatched through the same controllers that serve
        `/api/v1/me/servers` and `/api/v1/servers/{id}/proxy/{path}`, so the skill inherits the
        404/403 server-ownership gate, the relay-tunnel and bandwidth-quota checks, path-traversal
        rejection, and the proxy's read-only browse-scope allowlist. Nothing was added to that
        allowlist for the skill: it reaches exactly `GET /api/v1/media/search` and
        `GET /api/v1/media/{id}`.

        ## What the skill can and cannot do

        Supported intents are `PhlixTitleRuntimeIntent` (runtime/year/rating/summary for one title),
        `PhlixPlayLinkIntent` (returns a `<hub>/app/search?q=` link plus a `Simple` card),
        `AMAZON.HelpIntent`, `AMAZON.StopIntent`, `AMAZON.CancelIntent` and
        `AMAZON.FallbackIntent`. `LaunchRequest` speaks the capability statement;
        `SessionEndedRequest` is answered with an empty envelope and no speech, as Amazon requires.

        The response envelope can never contain `directives`, `AudioPlayer` or `VideoApp`: the
        builder has no parameter, field or code path capable of emitting them. The skill does not
        start playback on a device and does not cast, and no response string is permitted to imply
        that it does.

        ## Rate limiting

        60 requests / 60 seconds per caller, keyed on the TRUSTED client IP (`X-Forwarded-For`
        resolved through `TRUSTED_PROXIES`, so the HAProxy front is not the bucket). Enforced BEFORE
        verification, so a flood cannot amplify into one audit row per malicious request. Per-worker,
        so the effective bound is roughly `60 × HUB_WORKERS`.
      x-phlix-middleware: [AlexaSignatureMiddleware]
      security: []
      parameters:
        - name: Signature-256
          in: header
          required: true
          description: >-
            Base64 RSA-SHA256 signature over the raw request body. The legacy SHA-1 `Signature`
            header is rejected.
          schema:
            type: string
        - name: SignatureCertChainUrl
          in: header
          required: true
          description: >-
            HTTPS URL of Amazon's signing certificate chain. Must be on s3.amazonaws.com, port 443,
            path already canonical and under /echo.api/.
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        description: "An Alexa request envelope. The signature is verified over these exact bytes."
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: >-
            An Alexa response envelope. `SessionEndedRequest` yields `{version, response:
            {shouldEndSession: true}}` with no speech; every other request type carries a
            PlainText outputSpeech and, for the play-link intent, a Simple card.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: >-
            The signature gate refused the request (the body carries the machine-readable code and
            never the detail), or the body was not a usable Alexa envelope
            (`alexa.malformed_envelope`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
