      tags: ["Server Proxy"]
      summary: "Proxy a DELETE to a server"
      x-phlix-middleware: [AuthMiddleware]
      parameters:
        - name: "id"
          in: path
          required: true
          description: "Resource id (8-4-4-4-12 hex UUID)."
          schema:
            type: string
        - name: "path"
          in: path
          required: true
          description: "Remainder of the URL, forwarded verbatim to the target (may contain `/`)."
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |-
            The target server's own response, streamed back verbatim over the relay tunnel (frame types
            HTTP_REQUEST / HTTP_RESPONSE). Status, headers and body are the server's, so the shape is
            whatever that endpoint of the phlix-server API returns.
          content:
            '*/*':
              schema: {}
        "502":
          description: "No live tunnel to that server, or the server did not answer in time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
