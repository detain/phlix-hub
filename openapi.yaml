# phlix-hub OpenAPI description (S66).
#
# ⚠ THIS FILE IS HAND-MAINTAINED AND MACHINE-CHECKED.
#
# `paths` must be an EXACT bijection with the route table
# `Application::registerRoutes()` composes, including each operation's
# middleware chain. That is enforced by
# tests/Unit/Http/RouteRegistration/OpenApiSpecMatchesRouterTest.php, which
# drives the REAL registrars and fails on any route present in one artefact
# and not the other. Adding, moving or re-gating a route therefore requires
# editing this file in the same commit.
#
# Two extensions carry the machine-checked facts:
#   x-phlix-middleware  the route's middleware chain, in order, by class
#                       short name. `[]` means deliberately ungated.
#   x-phlix-route       present only when the router template differs from
#                       the OpenAPI path (OpenAPI has no `{name:regex}`
#                       form). The test compares THIS, not a normalised
#                       path, so no constraint change is hidden.
#
# WebSocket surfaces are NOT `paths`: the server tunnel mounts at the bare
# root of :8802, whose path key `/` is already taken by the HTTP SPA
# redirect on :8800. They live under the root `x-phlix-websockets`
# extension instead, with the full catalog in docs/websockets.md.

openapi: 3.1.0
info:
  title: "Phlix Hub API"
  version: "1.0.0"
  summary: "Multi-server cloud directory and reverse-tunnel relay for Phlix media servers."
  description: |-
    `phlix-hub` is the central directory a Phlix media server enrolls with, and the reverse tunnel
    through which a client reaches that server when it sits behind NAT. It is NOT the media server:
    library scanning, transcoding, HLS, DLNA and Live TV all live in `phlix-server` and are
    described by that repository's own specification.

    ## Surfaces

    - **`:8800` HTTP** — everything in `paths` below. Behind HAProxy in production.
    - **`:8802` WebSocket** — the media server's outbound relay tunnel.
    - **`:8803` WebSocket** — a client mounting a server through that tunnel.
    - **`:8804` WebSocket** — SyncPlay rooms relayed between clients.
    - **`:8805` WebSocket** — hub-to-hub federation (master side).

    The four WebSocket surfaces are described under the root `x-phlix-websockets` extension; their
    message and frame catalogs are in `docs/websockets.md`, which also covers `phlix-server`'s own
    `:8097` SyncPlay/events socket.

    ## Conventions

    Errors are a flat JSON envelope: `{"error": "<human text>", "code": "<machine code>"}`. Ids are
    8-4-4-4-12 hex UUIDs stored as `CHAR(36)`.

    Three distinct credentials appear here. A **user** bearer token is HS256 and is what the SPA and
    clients send. An **enrollment JWT** is Ed25519 and is what an enrolled media server sends; its
    public keys are published at `/.well-known/jwks.json`. A **client relay token** is minted by
    `POST /api/v1/me/servers/{id}/relay-token` and is presented only on the `:8803` WebSocket.

    Server-facing endpoints additionally require the `Accept-Phlix-Protocol: v1` header where
    `HubProtocolMiddleware` is in the chain; a missing or wrong value is a 400, not a 401.
  license:
    name: "MPL-2.0"
    identifier: "MPL-2.0"
  contact:
    name: "Phlix"
    url: "https://github.com/detain/phlix-hub"

servers:
  - url: "https://hub.phlix.tv"
    description: "Production hub."
  - url: "http://localhost:8800"
    description: "Local development (Workerman HTTP worker, unproxied)."

tags:
  - name: "Health"
    description: "Unauthenticated liveness surface."
  - name: "Web UI"
    description: "The `/app` Vue SPA shell plus the legacy server-rendered page paths, which now only redirect into it."
  - name: "Authentication"
    description: "Account creation, login, token refresh, and the current-user endpoints."
  - name: "My Servers"
    description: "A signed-in user's view of the media servers they have claimed."
  - name: "Server Proxy"
    description: "Authenticated HTTP proxied to a claimed server over its relay tunnel."
  - name: "Server Enrollment"
    description: "The claim/enroll/heartbeat lifecycle a media server drives, authenticated with an Ed25519 enrollment JWT."
  - name: "Relay"
    description: "HTTP signposts for the WebSocket relay surfaces. The tunnels themselves are not HTTP."
  - name: "Media Requests"
    description: "User requests for missing media, and the admin queue that approves them."
  - name: "Bandwidth and Quota"
    description: "Per-user relay byte accounting, monthly quota, and throttle."
  - name: "Library Sharing"
    description: "Sharing a library from one hub user to another."
  - name: "Invite Links"
    description: "Tokenised invitations that grant shares on redemption."
  - name: "Hub Settings"
    description: "Instance-wide settings. Admin only."
  - name: "Logs and Audit"
    description: "Log channel listing/tailing and the audit trail. Admin only."
  - name: "Admin Users"
    description: "User administration."
  - name: "Hub Administration"
    description: "Restart, update channel, and the admin dashboard."
  - name: "Federation"
    description: "Hub-to-hub peering, federated library offers, and admin delegation."
  - name: "Relay Metrics"
    description: "Relay counters, history, live connections, and per-route HTTP metrics."

paths:
  "/":
    get:
      operationId: "get_root"
      tags: ["Web UI"]
      summary: "Root redirect"
      description: |-
        Legacy server-rendered page path. The Smarty UI was retired; this path 302-redirects into the
        Vue SPA under `/app`.
      x-phlix-middleware: []
      security: []
      responses:
        "302":
          description: |-
            Redirect into the SPA at `/app/servers`.
          headers:
            Location:
              description: "/app/servers"
              schema:
                type: string
  "/.well-known/jwks.json":
    get:
      operationId: "get_well_known_jwks_json"
      tags: ["Server Enrollment"]
      summary: "Hub JWKS"
      description: |-
        Public Ed25519 verification keys for the enrollment JWTs the hub mints. Public and
        cache-frontable.
      x-phlix-middleware: []
      security: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
  "/admin/requests":
    get:
      operationId: "get_admin_requests"
      tags: ["Web UI"]
      summary: "Legacy admin media-requests page"
      description: |-
        Legacy server-rendered page path. The Smarty UI was retired; this path 302-redirects into the
        Vue SPA under `/app`.
      x-phlix-middleware: [AuthMiddleware, AdminMiddleware]
      security:
        - bearerAuth: []
      responses:
        "302":
          description: |-
            Always a redirect, but to one of two places. Signed in: `/app/admin/requests`. Not signed in:
            `AuthMiddleware` short-circuits first and answers a non-`/api/` path with `/app/login` rather
            than a JSON 401, so a browser is bounced to the login page.
          headers:
            Location:
              description: "/app/admin/requests when signed in, /app/login when not"
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/admin/dashboard/activity":
    get:
      operationId: "get_api_v1_admin_dashboard_activity"
      tags: ["Hub Administration"]
      summary: "Admin dashboard activity feed"
      x-phlix-middleware: [AuthMiddleware, AdminMiddleware]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
