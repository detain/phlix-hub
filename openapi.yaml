  "/api/v1/me/mcp-tokens":
    get:
      operationId: "get_api_v1_me_mcp_tokens"
      tags: ["MCP"]
      summary: "List my MCP personal access tokens"
      description: |-
        Metadata only — the plaintext of a token is unrecoverable, because only its SHA-256 hash was
        stored at mint time. Revoked and expired rows are included so the owner can see the history;
        each carries `revoked` / `expired` flags.
      x-phlix-middleware: [AuthMiddleware]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: "post_api_v1_me_mcp_tokens"
      tags: ["MCP"]
      summary: "Mint an MCP personal access token"
      description: |-
        Mints the long-lived (90-day default) bearer credential an MCP client presents to `POST /mcp`.
        The plaintext is returned EXACTLY ONCE and cannot be retrieved afterwards.

        The token is scoped to the calling USER, not to a server: `list_servers` has to enumerate
        every server that user owns. Per-server authorisation happens at USE time — every MCP tool
        call is routed through the same ownership check `/api/v1/servers/{id}/proxy/…` uses, so a
        token can only ever reach servers its user still owns at the moment of the call.

        `scopes` narrows the token below its user's own access; it can never widen it. An omitted
        list grants exactly the read-only set — `mcp:servers:read`, `mcp:library:read`,
        `mcp:playback:read` — and never `mcp:playback:control`; a caller who has expressed no
        opinion does not receive the write capability. Asking for `mcp:playback:control` explicitly
        still grants it. A list containing no recognised scope is a 400 rather than a token that
        authenticates but authorises nothing.
      x-phlix-middleware: [AuthMiddleware]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpTokenMintRequest"
      responses:
        "201":
          description: "Minted. The `token` field is shown here and nowhere else, ever."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTokenMinted"
        "400":
          description: "No recognised scope was requested."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/api/v1/me/mcp-tokens/{id}":
    delete:
      operationId: "delete_api_v1_me_mcp_tokens_id"
      tags: ["MCP"]
      summary: "Revoke one of my MCP tokens"
      description: |-
        Revocation is immediate and independent of expiry. An unknown id, an already-revoked token
        and a token belonging to somebody else are deliberately indistinguishable (all 404), so this
        endpoint cannot be used as an oracle for other users' token ids.
      x-phlix-middleware: [AuthMiddleware]
      parameters:
        - name: "id"
          in: path
          required: true
          description: "Resource id (8-4-4-4-12 hex UUID)."
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Revoked."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
